[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mode-switcher"
version = "0.1.0a1"
description = "Privacy-first local profile switching core for Codex"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
codex-mode-switcher = "codex_mode_switcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
